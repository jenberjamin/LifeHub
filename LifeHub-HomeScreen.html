          <circle class="solid" cx="9" cy="10" r="1.2"/>
          <circle class="solid" cx="15" cy="10" r="1.2"/>
          <path d="M8.2 14.2a4.6 4.6 0 0 0 7.6 0"/>
        </svg>
      </button>

      <textarea id="chat-input" rows="1" placeholder="Type your message here&#8230;"
                aria-label="Message"></textarea>

      <button class="chat-icon" id="mic-btn" type="button" aria-label="Dictate" title="Dictate">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
          <path d="M12 18v3"/>
        </svg>
        <span class="mic-ring" aria-hidden="true"></span>
      </button>

      <button class="chat-icon send" id="chat-send" type="button" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M3.6 20.4 21 12 3.6 3.6 3.6 10.2 15 12 3.6 13.8z"/></svg>
      </button>
    </div>

    <div class="msg-menu" id="msg-menu" role="menu"></div>
    <span class="chat-toast" id="chat-toast" aria-live="polite"></span>

    <!-- ENGINE CONFIGURATION -->
    <div class="chat-overlay" id="engine-panel" role="dialog" aria-label="Engine configuration">
      <div class="ov-head">
        <p class="ov-title">Engine configuration</p>
        <button class="chat-x" id="engine-x" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="ov-body">
        <div class="fld">
          <span>Connection</span>
          <div class="chips seg" id="cfg-conn"></div>
        </div>

        <label class="fld" id="fld-url">
          <span>Server URL</span>
          <input type="text" id="cfg-url" spellcheck="false" placeholder="http://localhost:3000/api/chat">
        </label>

        <!-- Keys live here and only here. The Gemini key also powers
             Poppy's voice, whichever connection the chat is on. -->
        <!-- Each key box has a drawer of saved keys under it. Picking one
             switches to it on the spot; the full key is never shown. -->
        <div class="fld" id="fld-key-gemini">
          <span id="key-label">Gemini key (AI Studio) &#183; also Poppy's voice</span>
          <input type="password" id="cfg-key" spellcheck="false" autocomplete="off" placeholder="From aistudio.google.com/apikey">
          <div class="keyring" data-provider="gemini" data-input="cfg-key">
            <select class="kr-list" aria-label="Saved Gemini keys"></select>
            <div class="kr-row">
              <input type="text" class="kr-name" spellcheck="false" placeholder="Name it (optional)">
              <button class="chip kr-add" type="button">Save to drawer</button>
              <button class="chip kr-del" type="button">Remove</button>
            </div>
          </div>
        </div>

        <div class="fld" id="fld-key-openrouter">
          <span>OpenRouter key</span>
          <input type="password" id="cfg-key-or" spellcheck="false" autocomplete="off" placeholder="From openrouter.ai/keys">
          <div class="keyring" data-provider="openrouter" data-input="cfg-key-or">
            <select class="kr-list" aria-label="Saved OpenRouter keys"></select>
            <div class="kr-row">
              <input type="text" class="kr-name" spellcheck="false" placeholder="Name it (optional)">
              <button class="chip kr-add" type="button">Save to drawer</button>
              <button class="chip kr-del" type="button">Remove</button>
            </div>
          </div>
        </div>

        <!-- OpenRouter: the live list of free models, so nothing has to
             be typed. Filled from openrouter.ai when this is shown. -->
        <label class="fld" id="fld-or-models">
          <span>Free models on OpenRouter</span>
          <select id="cfg-or-models"><option value="">Loading the list&#8230;</option></select>
        </label>

        <label class="fld">
          <span>Model</span>
          <input type="text" id="cfg-model" spellcheck="false" placeholder="gemini-3.5-flash">
        </label>
        <div class="chips" id="cfg-chips"></div>

        <label class="fld">
          <span>Thinking</span>
          <select id="cfg-thinking">
            <option value="quick">Quick &#8212; answers fastest</option>
            <option value="balanced">Balanced &#8212; a little thought</option>
            <option value="default">Model default &#8212; slowest</option>
          </select>
        </label>

        <div class="fld-row">
          <label class="fld">
            <span>Context budget</span>
            <input type="number" id="cfg-budget" min="1000" step="1000">
          </label>
          <label class="fld">
            <span>Max reply tokens</span>
            <input type="number" id="cfg-max" min="256" step="256">
          </label>
        </div>

        <p class="ov-note" id="engine-note"></p>
      </div>

      <div class="ov-foot">
        <button class="btn ghost" id="engine-reset" type="button">Reset</button>
        <button class="btn primary" id="engine-save" type="button">Save</button>
      </div>
    </div>

    <!-- VOICE -->
    <div class="chat-overlay" id="voice-panel" role="dialog" aria-label="Voice">
      <div class="ov-head">
        <p class="ov-title">Voice</p>
        <button class="chat-x" id="voice-x" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="ov-body">
        <label class="switch">
          <input type="checkbox" id="voice-auto">
          <span>Speak Poppy's replies</span>
        </label>

        <label class="fld">
          <span>Engine</span>
          <select id="cfg-voice-engine">
            <option value="gemini">Gemini &#8212; natural (needs a Gemini key)</option>
            <option value="browser">Browser voices</option>
          </select>
        </label>

        <!-- Gemini: JS/poppy/LifeHub-poppy-voice.js -->
        <div id="voice-gemini">
          <label class="fld">
            <span>Voice</span>
            <select id="cfg-gvoice"></select>
          </label>

          <label class="fld">
            <span>How she should sound</span>
            <input type="text" id="cfg-gstyle" spellcheck="false">
          </label>

          <label class="fld">
            <span>Model</span>
            <select id="cfg-gmodel"></select>
          </label>

          <!-- The key lives in Engine configuration, shared with the chat.
               This button goes straight to it. -->
          <div class="fld">
            <span>Gemini key</span>
            <p class="ov-note" id="voice-key-note"></p>
            <button class="btn ghost" id="voice-key-btn" type="button">Open the key in Engine configuration</button>
          </div>
        </div>

        <!-- Browser voices -->
        <div id="voice-browser">
          <label class="fld">
            <span>Voice</span>
            <select id="cfg-voice"></select>
          </label>

          <label class="fld">
            <span>Pitch <b id="pitch-out">1.00</b></span>
            <input type="range" id="cfg-pitch" min="0.5" max="1.8" step="0.05">
          </label>
        </div>

        <label class="fld">
          <span>Speed <b id="rate-out">1.00&#215;</b></span>
          <input type="range" id="cfg-rate" min="0.5" max="2" step="0.05">
        </label>

        <p class="ov-note" id="voice-note"></p>
      </div>

      <div class="ov-foot">
        <button class="btn ghost" id="voice-test" type="button">Test</button>
        <button class="btn primary" id="voice-save" type="button">Save</button>
      </div>
    </div>

    <!-- CLOSE CONFIRMATION -->
    <div class="chat-overlay center" id="close-confirm" role="dialog" aria-label="Close chat">
      <div class="confirm">
        <p class="ov-title">Close chat?</p>
        <p class="ov-note">This clears the conversation. Minimise instead to keep it.</p>
        <div class="ov-foot">
          <button class="btn ghost" id="confirm-cancel" type="button">Cancel</button>
          <button class="btn primary" id="confirm-close" type="button">Close</button>
        </div>
      </div>
    </div>
  </section>

  <script src="JS/homescreen/LifeHub-homescreen-slides.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- Poppy reads Firestore; the trackers all live in the Realtime
       Database, so the nudges panel needs this one too. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <!-- PASSAGE, added 2026-09-17 — Scribble is guarded, so reading it now
       needs a session. This is the only page that needs auth: every other
       Firebase project LifeHub touches is open. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- What prestige is: the tiers, and which ledger rows count toward a
       rank. Pure logic, no Firebase. Must load before anything that reads
       or writes the ledger — Poppy's fetch layer does both. -->
  <script src="JS/lifehub-prestige-ledger.js"></script>

  <!-- The Sleep Protocol: Jen's rewards and penalties, and the rules for
       earning them. Pure logic, no Firebase. Poppy reads it to answer
       what she has earned; the achievements panel reads it to preview
       the cards. Must load before both. -->
  <script src="JS/lifehub-sleep-protocol.js"></script>

  <!-- The goal, the drink table and the unit maths, then the phases and
       trophies built on top of them. The reminder paces against the
       first; the achievements panel reads the second. Order matters —
       the protocol asks the rules for the goal. -->
  <script src="JS/lifehub-hydration-rules.js"></script>
  <script src="JS/lifehub-hydration-protocol.js"></script>

  <!-- The daily macro targets, the wage rubric, and the one shared way
       of reading a logged item — including where sugar hides on older
       entries. Poppy's fetch layer and food actions both need it. -->
  <script src="JS/lifehub-food-rules.js"></script>

  <!-- The weekly food trophies. The achievements panel reads this for
       the card wordings; Poppy reads it to say what is close. -->
  <script src="JS/lifehub-food-protocol.js"></script>

  <!-- The hydration goal, rates and unit maths. Shared with the tracker
       page so a goal changed in one place is changed in both. -->
  <script src="JS/lifehub-hydration-rules.js"></script>

  <!-- Every screen navigation can send her to. Shared with Poppy's
       navigate action below; the Lambda keeps its own copy because it
       deploys separately. Must load before PoppyEngine-navigate.js. -->
  <script src="JS/lifehub-destinations.js"></script>

  <!-- The jump listener every other page already had. Without it the
       Home Screen was the one place navigation didn't work — Poppy
       could write the command, and the page she wrote it from wasn't
       listening for it. Alexa had the same problem here. -->
  <script src="JS/lifehub-navigation-core.js"></script>

  <!-- PASSAGE, added 2026-09-17 — picks up the session Scribble leaves
       for us, so Poppy's Scribble reads stop being refused. Must come
       BEFORE the fetch layer, which waits on it.
       See JS/poppy/LifeHub-poppy-scribble-passage.js -->
  <script src="JS/poppy/LifeHub-poppy-scribble-passage.js"></script>
  <script src="JS/poppy/LifeHub-poppy-firebase-fetch.js"></script>
  <script src="JS/poppy/PoppyEngine-core.js"></script>
  <script src="JS/poppy/LifeHub-poppy-prompts.js"></script>
  <script src="JS/poppy/LifeHub-poppy.js"></script>
  <!-- Poppy's natural voice (Gemini text-to-speech). Optional: without
       it she uses the browser's voices, same as before. -->
  <script src="JS/poppy/LifeHub-poppy-voice.js"></script>

  <script src="JS/homescreen/LifeHub-homescreen-search.js"></script>

  <!-- The pack schedule — 21 tablets, then a 7-day break. Pure maths,
       no DOM and no Firebase, and the FLO tracker's own copy: the pill
       reminder below has to agree with the tracker about which tablet
       today is, and the only way to guarantee that is to read it from
       the same file rather than re-deriving it here. -->
  <script src="Trackers/FLO/js/flo-cycle-analysis.js"></script>
  <!-- What a tablet is worth and how the streak counts. Shared with
       the FLO tracker, so Poppy pays what the buttons there pay. -->
  <script src="JS/lifehub-pill-rules.js"></script>
  <!-- The five pick-from-a-list fields: the exact options the tracker
       stores, and the matcher that turns "my boobs hurt" into
       TENDER BREAST. Needed before PoppyEngine-flo.js. -->
  <script src="JS/lifehub-flo-vocab.js"></script>
  <script src="JS/homescreen/LifeHub-homescreen-nudges.js"></script>

  <!-- The nudges panel's counterpart: fires on an event rather than a
       state, so prestige stays in the bank and only surfaces here at the
       moment a tier is crossed. Needs the ledger above for the tiers. -->
  <script src="JS/homescreen/LifeHub-homescreen-achievements.js"></script>

  <!-- Paced, not stateful: one card that replaces itself as the day
       moves. Loaded after the achievements panel so a trophy toast sits
       above it rather than under it. -->
  <script src="JS/homescreen/LifeHub-homescreen-hydration.js"></script>

  <!-- The same idea for food. Sits just above the hydration card
       rather than on top of it — see the z-index in each file. -->
  <script src="JS/homescreen/LifeHub-homescreen-food.js"></script>

  <!-- Reads the action blocks out of Poppy's replies. Shared with the
       phone chat (LifeHub-poppy-phone.html). Must load before the next one. -->
  <script src="JS/poppy/LifeHub-poppy-actions.js"></script>
  <script src="JS/homescreen/LifeHub-homescreen.js"></script>

  <!-- Wraps LIFEHUB_ACTIONS. Must stay last: LifeHub-homescreen.js reassigns it.
       Each app wraps whatever the one before it left, so order here is
       load order, not priority — a later file can't hide an earlier one's
       actions, it only adds its own. -->
  <script src="JS/poppy/PoppyEngine-scribble.js"></script>
  <script src="JS/poppy/PoppyEngine-sleep.js"></script>
  <script src="JS/poppy/PoppyEngine-prestige.js"></script>
  <script src="JS/poppy/PoppyEngine-hydration.js"></script>
  <script src="JS/poppy/PoppyEngine-food.js"></script>
  <script src="JS/poppy/PoppyEngine-flo.js"></script>
  <script src="JS/poppy/PoppyEngine-fitness.js"></script>
  <script src="JS/poppy/PoppyEngine-navigate.js"></script>

  <!-- PassHub's lock, reused rather than reimplemented: the same
       PBKDF2 hashes, the same twenty security questions, the same
       access log. PoppyEngine-passhub.js hands PH_AUTH a database
       handle from Poppy's named "passhub" app, so neither of these
       claims the default Firebase app the way the hub's own
       passhub-firebase.js does — that one belongs to
       lifehub-navigation-core.js above.

       No password ever reaches Poppy or the model; the engine paints
       them onto the page and returns only a receipt. See the header
       of PoppyEngine-passhub.js for why that is the whole design. -->
  <script src="Hubs/PassHub/js/passhub-auth.js"></script>
  <script src="Hubs/PassHub/js/passhub-access-log.js"></script>
  <script src="JS/poppy/PoppyEngine-passhub.js"></script>

  <!-- Alexa's side of every tracker. Drains here because the wallpaper
       is open whenever the PC is, and because the two files above
       already hold the real logging logic — the alternative was a third
       copy of every rate inside a Lambda. Must load after them. -->
  <script src="JS/homescreen/LifeHub-homescreen-intake-queue.js"></script>
</body>
</html>
