<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../JS/lifehub-tv-frame.js"></script>
    <title>FoodHub | History</title>

    <link rel="icon" type="image/png" href="css/files/FoodHub.png">
    <link rel="stylesheet" href="css/food-history.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <meta name="theme-color" content="#1A3C34">
</head>
<body>

    <a href="FoodHub.html" class="back-arrow"><span class="material-symbols-rounded">arrow_back</span></a>

    <div class="page-container">
        
        <div class="top-bar">
            <div class="header-content">
                <h1>HISTORY</h1>
                <div class="subtitle-divider"><span>H E A L T H I E R &nbsp; J E N</span><div class="line"></div></div>
            </div>

            <div class="month-nav">
                <span class="material-symbols-rounded nav-btn" onclick="changeMonth(-1)">chevron_left</span>
                <span id="monthDisplay" style="text-transform: uppercase; letter-spacing: 1px;">DECEMBER 2025</span>
                <span class="material-symbols-rounded nav-btn" onclick="changeMonth(1)">chevron_right</span>
            </div>
        </div>

        <div class="history-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 25%">(Day, Date)</th>
                        <th style="width: 12%">(overall cal)</th>
                        <th style="width: 12%">(overall fats)</th>
                        <th style="width: 12%">(overall carbs)</th>
                        <th style="width: 12%">(overall protein)</th>
                        <th style="width: 12%">(overall sugar)</th>
                        <th style="width: 5%; text-align: center;"></th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                </tbody>
            </table>
        </div>

    </div>

    <div id="historyDetailModal" class="modal-overlay hidden">
        <div class="modal-box" style="width: 1000px; max-width: 95%; max-height: 90vh; display: flex; flex-direction: column;">
            
            <div class="modal-header" style="border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span class="material-symbols-rounded" style="color: var(--primary-green); font-size: 1.8rem;">history_toggle_off</span>
                    <h3 id="historyDetailTitle" style="font-weight: 300; font-size: 1.5rem; color: var(--text-dark);">DATE</h3>
                </div>
                <span class="material-symbols-rounded close-icon" onclick="closeHistoryModal()">close</span>
            </div>

            <div class="history-detail-list" style="overflow-y: auto; flex-grow: 1;">
                <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
                    <thead>
                        <tr style="border-bottom: 2px solid #F4F4F0;">
                            <th style="text-align: left; padding: 1rem; color: #888; font-weight: 500; width: 5%;">#</th>
                            <th style="text-align: left; padding: 1rem; color: #888; font-weight: 500; width: 22%;">Food Name</th>
                            <th style="text-align: left; padding: 1rem; color: #888; font-weight: 500; width: 13%;">Serving</th>
                            <th style="text-align: left; padding: 1rem; color: #888; font-weight: 500; width: 8%;">Time</th>
                            
                            <th style="text-align: center; padding: 1rem; color: #888; font-weight: 500;">Cal</th>
                            <th style="text-align: center; padding: 1rem; color: #888; font-weight: 500;">Carb</th>
                            <th style="text-align: center; padding: 1rem; color: #888; font-weight: 500;">Fat</th>
                            <th style="text-align: center; padding: 1rem; color: #888; font-weight: 500;">Prot</th>
                            <th style="text-align: center; padding: 1rem; color: #888; font-weight: 500;">Sugar</th>
                            <th style="text-align: center; padding: 1rem; width: 5%;"></th>
                        </tr>
                    </thead>
                    <tbody id="historyDetailBody">
                    </tbody>
                </table>
            </div>
            
        </div>
    </div>

    <!-- FIREBASE SCRIPTS - FIXED -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- YOUR SCRIPT -->
    <!-- The daily targets, the wage rubric and the one shared way of
     reading a logged item's macros. Must load first. -->
<script src="../../JS/lifehub-food-rules.js"></script>
<script src="js/food-history.js"></script>

    <!-- SERVICE WORKER -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker failed:', err));
            });
        }
    </script>
<script src="../../JS/lifehub-navigation-core.js"></script>
</body>
</html>
