    <!-- ── SECURITY SENSOR ──
         Moved from the bottom of <body> into <head>. Down there, the whole
         lobby painted first — so an unauthorised visitor got a clear look at
         every category name before being bounced. Up here it runs before
         anything renders.

         location.replace, not .href, so the bounce doesn't leave an entry in
         history that the back button can land on. -->
    <script>
    if (!sessionStorage.getItem('PH_ACCESS_TOKEN')) {

    }
    </script>

<script>
    function lockVault() {
        // Drop the session token
        sessionStorage.removeItem('PH_ACCESS_TOKEN');
        // And the shared unlock record the gate now writes. Removing
        // only the token would leave the hub unlocked for any tab
        // that has moved onto the new check.
        try { localStorage.removeItem('PH_LOCK'); } catch (e) {}

        // Worth a line in the history: "locked at 11pm" is the thing
        // that makes an entry at 3am stand out.
        try { PH_ACCESS_LOG.record('manual-lock', 'Locked from the lobby'); } catch (e) {}

        // The write is fired at the socket, not awaited — navigating
        // this instant can cut it off, so give it a moment. The gate
        // now auto-skips when a token exists, so ?lock=1 is
        // belt-and-braces: even if removeItem were to fail, the gate
        // clears the token itself rather than waving you through.
        setTimeout(function () {
            window.location.replace("../../LifeHub-trackers.html");
        }, 250);
    }
</script>
