<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sims 4 Menu</title>
    <!-- Import Tailwind CSS for styling --><script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Import Century Gothic font */
        @import url('https://fonts.cdnfonts.com/css/century-gothic');

        body {
            font-family: 'Century Gothic', sans-serif;
            /* Set the background image */
            background-image: url('https://i.imgur.com/SyuVLuZ.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
        }

        /* Custom class for the white text glow */
        .text-glow {
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8), 0 0 8px rgba(255, 255, 255, 0.7);
        }

        /* Custom class for the white button glow */
        .button-glow {
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.7), 0 0 12px rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease-in-out;
        }

        .button-glow:hover {
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 16px rgba(255, 255, 255, 0.8);
            transform: scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar --><nav class="bg-black text-white h-16 flex justify-between items-center px-6 md:px-10">
        <!-- Left-side links --><div class="flex items-baseline space-x-6">
            <a href="#" class="text-xl font-bold tracking-wide hover:opacity-80 transition-opacity">HOME</a>
            <a href="#" class="text-sm font-medium tracking-wider hover:opacity-80 transition-opacity">GAMEPLAY</a>
            <a href="#" class="text-sm font-medium tracking-wider hover:opacity-80 transition-opacity">MODS</a>
            <a href="#" class="text-sm font-medium tracking-wider hover:opacity-80 transition-opacity">CUSTOM CONTENTS</a>
        </div>
        
        <!-- Right-side text --><div>
            <span class="text-2xl font-bold text-glow tracking-wider">Create-a-Sim</span>
        </div>
    </nav>

    <!-- Main Content Area --><main class="flex-grow relative">
        <!-- Sims 4 Logo --><img src="https://i.imgur.com/QdFZp1V.png" 
             alt="The Sims 4 Logo" 
             class="absolute top-2 left-6 md:left-10 w-36 md:w-48"
             onerror="this.style.display='none'"> <!-- Hide if logo fails to load --><!-- Button Grid --><div class="absolute top-8 right-8 md:right-16 lg:right-24">
            <div class="grid grid-cols-2 gap-x-4 gap-y-3">
                <!-- Row 1 --><button class="bg-white text-black px-5 py-1.5 rounded-full text-sm font-extrabold button-glow">Lot Trait</button>
                <button class="bg-white text-black px-5 py-1.5 rounded-full text-sm font-extrabold button-glow">CAS Traits</button>
                
                <!-- Row 2 --><button class="bg-white text-black px-5 py-1.5 rounded-full text-sm font-extrabold button-glow">Traditions</button>
                <button class="bg-white text-black px-5 py-1.5 rounded-full text-sm font-extrabold button-glow">Aspirations</button>

                <!-- Row 3 --><button class="bg-white text-black px-5 py-1.5 rounded-full text-sm font-extrabold button-glow">Events</button>
                <button class="bg-white text-black px-5 py-1.5 rounded-full text-sm font-extrabold button-glow">Animations</button>

                <!-- Row 4 --><button class="bg-white text-black px-5 py-1.5 rounded-full text-sm font-extrabold button-glow">Bug Fix</button>
                <button class="bg-white text-black px-5 py-1.5 rounded-full text-sm font-extrabold button-glow">Interactions</button>
            </div>
        </div>
    </main>

</body>
</html>
