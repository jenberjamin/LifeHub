<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../../JS/lifehub-tv-frame.js"></script>
    <title>LifeHub: Mod Collections</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --font-display: 'Oswald', sans-serif; 
            --font-body: 'Red Hat Display', sans-serif; 
            --color-accent: #18e248; 
            --glass-panel-main: rgba(255, 255, 255, 0.60);
            --glass-border: 1px solid rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: var(--font-body);
            background-color: #333;
            color: #1a1a1a;
            overflow: hidden; 
        }

        /* --- BACKGROUND --- */
        .bg-layer {
            position: absolute; inset: 0; z-index: 0;
            background-image: url('Background_Mods_Lobby.webp'); 
            background-size: cover; background-position: center;
        }

        /* --- NAV (Black Glass) --- */
        .glass-nav {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(5px);
        }
        .text-glow:hover { text-shadow: 0 0 8px rgba(255, 255, 255, 0.6); }

        /* --- HALLWAY CONTAINER --- */
        .hallway-container {
            position: absolute; 
            top: 64px; bottom: 0; left: 0; right: 0;
            z-index: 10;
            padding: 40px 80px; /* Reduced padding slightly */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

       /* --- HALLWAY CONTAINER --- */
        .hallway-container {
            position: absolute; 
            top: 64px; bottom: 0; left: 0; right: 0;
            z-index: 10;
            padding: 40px 80px;
            overflow-y: auto;
            display: flex; flex-direction: column; align-items: center; 
        }

        .hallway-header {
            width: 100%; max-width: 1000px;
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 30px; padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }

        .page-title {
            font-family: var(--font-display); font-size: 32px; color: #fff;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .breadcrumb {
            color: rgba(255,255,255,0.7); font-size: 11px; letter-spacing: 1px;
            text-transform: uppercase; font-weight: 500;
        }

        /* --- FOLDER GRID --- */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px;
            width: 100%; max-width: 1000px;
        }

        /* --- FOLDER CARD --- */
        .folder-card {
            background: var(--glass-panel-main);
            border: var(--glass-border);
            border-radius: 8px;
            height: 140px;
            padding: 20px;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            backdrop-filter: blur(10px);
            position: relative;
            text-decoration: none;
        }
        .folder-card:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .folder-icon {
            font-size: 32px; color: #444; margin-bottom: 5px; transition: 0.3s;
        }
        .folder-card:hover .folder-icon { color: var(--color-accent); }

        .folder-info h2 {
            font-family: var(--font-display); font-size: 16px; color: #111; margin: 0;
            text-transform: uppercase; letter-spacing: 1px; line-height: 1.2;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .folder-info p {
            font-size: 10px; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px;
        }

        /* Folder Action Menu (The Gear) */
        .folder-actions {
            position: absolute; top: 10px; right: 10px;
            z-index: 20; opacity: 0; transition: 0.2s;
        }
        .folder-card:hover .folder-actions { opacity: 1; }
        
        .action-icon {
            color: #999; font-size: 18px; padding: 5px; border-radius: 50%;
            background: rgba(255,255,255,0.8);
        }
        .action-icon:hover { color: #111; background: #fff; }

        /* --- "ADD NEW" BUTTON --- */
        .folder-card.add-new {
            background: rgba(0, 0, 0, 0.4); border: none;
            align-items: center; justify-content: center;
        }
        .folder-card.add-new:hover {
            background: rgba(0, 0, 0, 0.6); 
            box-shadow: 0 0 15px rgba(24, 226, 72, 0.2); 
        }
        .folder-card.add-new .material-symbols-outlined {
            font-size: 32px; color: rgba(255,255,255,0.5); transition: 0.3s;
        }
        .folder-card.add-new:hover .material-symbols-outlined { 
            color: var(--color-accent); transform: scale(1.1); 
        }
        .folder-card.add-new span:last-child {
            margin-top: 8px; color: white; font-size: 10px; text-transform: uppercase; 
            letter-spacing: 2px; font-weight: 700;
        }


        /* --- MODAL SYSTEM --- */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .glass-modal {
            width: 400px; background: rgba(255,255,255,0.95);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 30px; border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transform: scale(0.95); transition: 0.3s;
        }
        .modal-overlay.active .glass-modal { transform: scale(1); }

        .modal-title {
            font-family: var(--font-display); font-size: 24px; color: #111;
            text-transform: uppercase; margin-bottom: 20px;
        }
        
        .form-group { margin-bottom: 20px; }
        .form-label {
            font-size: 10px; text-transform: uppercase; font-weight: 700; 
            letter-spacing: 1px; color: #666; display: block; margin-bottom: 5px;
        }
        .glass-input {
            width: 100%; background: #f0f0f0; border: none; padding: 12px;
            font-family: var(--font-body); font-weight: 600; color: #333;
            border-radius: 6px; outline: none;
        }
        .glass-input:focus { background: #fff; box-shadow: 0 0 0 2px var(--color-accent); }

        .icon-preview-box {
            display: flex; align-items: center; gap: 15px;
            margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 6px;
        }
        
        .modal-actions {
            display: flex; gap: 10px; margin-top: 30px;
        }
        .btn-modal {
            flex: 1; padding: 12px; border: none; font-weight: 700; 
            text-transform: uppercase; letter-spacing: 1px; font-size: 12px;
            cursor: pointer; border-radius: 6px; transition: 0.2s;
        }
        .btn-cancel { background: #eee; color: #666; }
        .btn-cancel:hover { background: #ddd; color: #111; }
        
        .btn-confirm { background: #111; color: #fff; }
        .btn-confirm:hover { background: var(--color-accent); color: #000; }
        .btn-delete { background: #ff4444; color: #fff; }
        .btn-delete:hover { background: #cc0000; }


    </style>
</head>
<body class="text-white">

<img src="Background_Mods_Lobby.webp" 
     alt="Mods Background" 
     class="absolute inset-0 w-full h-full object-cover z-0">

    <nav class="glass-nav text-white h-16 flex justify-between items-center px-8 relative z-20 shadow-md">
        <div class="flex items-baseline space-x-8">
            <a href="Sims4-HQ.html" class="text-xs font-medium tracking-widest text-gray-300 hover:text-white hover:opacity-100 transition-all">HOME</a>
            <a href="#" class="text-xs font-medium tracking-widest text-gray-300 hover:text-white hover:opacity-100 transition-all">GAMEPLAY</a>
            <a href="Sims4-Mods.html" class="text-sm font-bold tracking-widest text-white border-b-2 border-[#00e5ff] pb-1" style="text-shadow: 0 0 10px rgba(255,255,255,0.5);">MODS</a>
            <a href="#" class="text-xs font-medium tracking-widest text-gray-300 hover:text-white hover:opacity-100 transition-all">CUSTOM CONTENT</a>
            <a href="#" class="text-xs font-medium tracking-widest text-gray-300 hover:text-white hover:opacity-100 transition-all">LOT GALLERY</a>
        </div>
        <div class="flex items-center gap-4">
            <button class="flex items-center gap-2 group cursor-pointer">
                <span class="text-xl font-bold tracking-wider text-glow transition-all">Create-a-Sim</span>
                <span class="material-icons text-xl group-hover:rotate-90 transition-transform duration-300">wallpaper</span>
            </button>
        </div>
    </nav>

    <div class="hallway-container">
        <div class="hallway-header">
            <div>
                <div class="breadcrumb">Sims 4 HQ</div>
                <h1 class="page-title">Mod Collections</h1>
            </div>
            <div class="text-right">
                <div id="total-count" class="text-3xl font-bold font-oswald text-[#00e5ff]">0</div>
                <div class="text-xs uppercase tracking-widest text-gray-300">Sections</div>
            </div>
        </div>

        <div id="folder-grid" class="folder-grid">
            </div>
    </div>

    <div id="modal-editor" class="modal-overlay">
        <div class="glass-modal">
            <h2 id="modal-title" class="modal-title">New Collection</h2>
            
            <input type="hidden" id="edit-id">

            <div class="form-group">
                <label class="form-label">Collection Name</label>
                <input type="text" id="inp-name" class="glass-input" placeholder="e.g. Wicked Whims">
            </div>

            <div class="form-group">
                <label class="form-label">Icon Code (Google Fonts)</label>
                <input type="text" id="inp-icon" class="glass-input" placeholder="folder_open">
                
                <div class="icon-preview-box">
                    <span id="icon-preview" class="material-symbols-outlined text-3xl text-gray-600">folder_open</span>
                    <span class="text-xs text-gray-500 font-bold uppercase">Preview</span>
                    <a href="https://fonts.google.com/icons" target="_blank" class="text-xs text-[#00e5ff] ml-auto hover:underline">Find Icons ↗</a>
                </div>
            </div>

            <div class="modal-actions">
                <button id="btn-cancel-edit" class="btn-modal btn-cancel">Cancel</button>
                <button id="btn-save" class="btn-modal btn-confirm">Save Collection</button>
            </div>
        </div>
    </div>

    <div id="modal-delete" class="modal-overlay">
        <div class="glass-modal">
            <h2 class="modal-title text-red-600">Delete Collection?</h2>
            <p class="text-gray-600 text-sm font-medium mb-6">Are you sure you want to delete <span id="del-name" class="font-bold text-black">this folder</span>? This cannot be undone.</p>
            
            <div class="modal-actions">
                <button id="btn-cancel-del" class="btn-modal btn-cancel">Cancel</button>
                <button id="btn-confirm-del" class="btn-modal btn-delete">Delete</button>
            </div>
        </div>
    </div>

    <script src="core-mods.js"></script>

</body>

</body>
</html>
