<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sleep Lite</title>
    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    

<link rel="manifest" href="/manifest-mobile-sleep.json">
<meta name="theme-color" content="#5A6B5D">
<link rel="apple-touch-icon" href="icon-192.png">

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js') // This looks at root, which is correct
                .then(reg => console.log('LifeHub Service Worker registered'))
                .catch(err => console.log('Service Worker failed:', err));
        });
    }
</script>

    <style>
        :root {
            --bg-color: #f4f1ea; /* Warm Beige Paper */
            --card-bg: #ffffff;
            --text-main: #3e3831;
            --accent: #8b857e;
            --sage: #8F9E91;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Red Hat Display', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* App-like feel */
        }

        /* --- HEADER --- */
        .app-header {
            padding: 20px 25px;
            padding-top: 60px; /* Space for status bar */
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
        }

        .app-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .date-picker {
            border: none; background: rgba(0,0,0,0.05); 
            padding: 8px 12px; border-radius: 8px;
            font-family: inherit; font-size: 14px; color: var(--text-main);
            outline: none;
        }

        /* --- SCROLLABLE CONTENT --- */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 25px;
            padding-bottom: 100px; /* Space for fixed button */
        }

        /* --- CARDS --- */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px; 
            color: var(--accent); margin-bottom: 10px; display: block; font-weight: 600;
        }

        /* --- TIME INPUTS --- */
        .time-row {
            display: flex; gap: 15px;
        }
        .time-group { flex: 1; }
        
        .big-input {
            width: 100%;
            border: 1px solid #eee;
            background: #fdfdfd;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            font-family: inherit;
            color: var(--text-main);
            outline: none;
            -webkit-appearance: none;
        }
        .big-input:focus { border-color: var(--sage); background: #fff; }

        .calc-display {
            text-align: center;
            font-size: 14px;
            color: var(--accent);
            margin-top: 10px;
            font-weight: 500;
        }

        /* --- SLIDER --- */
        .slider-container { display: flex; align-items: center; gap: 15px; }
        .range-slider {
            flex: 1; -webkit-appearance: none; height: 6px; background: #eee; border-radius: 5px;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
            background: var(--sage); box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .score-box {
            font-size: 18px; font-weight: 700; color: var(--sage); width: 40px; text-align: center;
        }

        /* --- CHIPS --- */
        .chips-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            padding: 10px 16px;
            background: #f4f4f4;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .chip.selected {
            background: var(--sage);
            color: #fff;
            box-shadow: 0 4px 10px rgba(143, 158, 145, 0.4);
        }

        /* --- DROPDOWN --- */
        .full-select {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #eee;
            background: #fdfdfd; font-size: 16px; color: var(--text-main); outline: none;
        }

        /* --- FOOTER ACTION --- */
        .action-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 20px 25px;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 40px; /* Safety for iPhone home bar */
        }

        .log-btn {
            width: 100%;
            background: #3e3831;
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(62, 56, 49, 0.2);
            transition: transform 0.1s;
        }
        .log-btn:active { transform: scale(0.98); }

    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title">Sleep Lite</div>
        <input type="date" id="logDate" class="date-picker">
    </header>

    <div class="content-area">
        
        <div class="card">
            <span class="label">Duration</span>
            <div class="time-row">
                <div class="time-group">
                    <label class="label">Bedtime</label>
                    <input type="time" id="bedtime" class="big-input">
                </div>
                <div class="time-group">
                    <label class="label">Wake Up</label>
                    <input type="time" id="waketime" class="big-input">
                </div>
            </div>
            <div class="calc-display" id="durationResult">0 hr 0 min</div>
        </div>

        <div class="card">
            <span class="label">Quality</span>
            <div class="slider-container">
                <input type="range" id="quality" min="1" max="10" value="5" class="range-slider">
                <div class="score-box" id="qualityVal">5</div>
            </div>
        </div>

        <div class="card">
            <span class="label">Feeling</span>
            <select id="sleepFeeling" class="full-select">
                <option value="Deep & Restored">Deep & Restored</option>
                <option value="Adequate">Adequate</option>
                <option value="Inadequate">Inadequate</option>
            </select>
        </div>

        <div class="card">
            <span class="label">Influences</span>
            <div class="chips-grid" id="factorsList"></div>
        </div>

    </div>

    <div class="action-bar">
        <button class="log-btn" onclick="saveSleepLog()">Confirm Log</button>
    </div>

    <div id="sleepDebtDisplay" style="display:none;"></div>
    <div id="sleepChart" style="display:none;"></div>
    <div id="avgSleep" style="display:none;"></div>
    <div id="logHistory" style="display:none;"></div>

    <script src="js/tracker-sleep.js"></script>

    <!-- Poppy. Firestore is for her surface channel only — the tracker
         itself lives entirely in the Realtime Database. Pinned to the
         same 9.23.0 as the two in the head so LifeHub-surface.js doesn't
         inject a second version's compat script beside them. -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../../JS/poppy/LifeHub-surface.js"></script>
    <script src="js/sleep-poppy-commands.js"></script>

</body>
</html>
