<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../JS/lifehub-tv-frame.js"></script>
    <title>LifeHub | Hydration Tracker</title>
    
    <link rel="icon" type="image/png" href="icons/Hydration-tracker.png">
    <!-- Filename casing matches the file on disk exactly. Windows doesn't
         care; anything serving this over HTTP will. -->
    <link rel="stylesheet" href="css/lifeHub-tracker-hydration.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

<!-- ONE Firebase version. This page used to load 9.23.0 and then 10.7.1;
     the second replaced window.firebase, so anything loading after it saw
     an empty firebase.apps and initialised a second default app. -->
<script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<!-- The goal, the rates and the unit maths. Shared with Poppy so the two
     can't disagree about how much a day needs. Must come before
     tracker-hydration.js, which now reads its constants from it.
     defer preserves order, so this still runs first. -->
<script defer src="../../JS/lifehub-hydration-rules.js"></script>

<!-- What prestige IS, and the Hydration Protocol built on the rules
     above — Jen's trophies and the Dehydrated penalty. Both are pure
     logic and both must load before tracker-hydration.js, which settles
     the protocol every time a sip is saved. -->
<script defer src="../../JS/lifehub-prestige-ledger.js"></script>
<script defer src="../../JS/lifehub-hydration-protocol.js"></script>

<!-- defer, so the DOM exists when these run. tracker-hydration.js used to
     execute in <head> and died on a null #historyModal, taking the Alexa
     listener below it with it. -->
<script defer src="js/tracker-hydration.js"></script>
<script defer src="../../JS/lifehub-navigation-core.js"></script>
</head>
<body>

    <!-- Two ways out: the wallpaper, or the interior. -->
    <nav class="nav-dock" aria-label="Leave the tracker">
      <a href="../../LifeHub-HomeScreen.html" class="nav-btn" title="Home Screen" aria-label="Home Screen">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
          <line x1="8" y1="21" x2="16" y2="21" />
          <line x1="12" y1="17" x2="12" y2="21" />
        </svg>
        <span>Home Screen</span>
      </a>
      <a href="../../LifeHub.html" class="nav-btn" title="LifeHub Lobby" aria-label="LifeHub Lobby">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20V8.2l8-4.2 8 4.2V20"/>
          <path d="M2.6 20h18.8"/>
          <path d="M9.9 20v-5.1a2.1 2.1 0 0 1 4.2 0V20"/>
        </svg>
        <span>Lobby</span>
      </a>
    </nav>

    <main class="main-stage">
        
        <div class="unified-glass-panel">
            
            <div class="dashboard-grid">

                <div class="panel-section input-zone">
                    <div class="section-header">
    <h2>Hydration Source</h2>
    <input type="date" id="logDate" class="date-picker-minimal">
</div>

                    <div class="water-progress-container">
                        <div class="circle-progress">
                            <div class="wave" id="waterWave"></div>
                            <div class="percentage-text" id="percentDisplay">0%</div>
                        </div>
                        
                        <div class="intake-text">
                            <span id="currentIntake">0</span> / <span id="goalIntake">100</span> oz
                        </div>

                        <div class="mode-toggle-container">
                            <label class="toggle-label">Workout Day?</label>
                            <label class="toggle-switch small">
                                <input type="checkbox" id="workoutToggle" onchange="toggleWorkoutMode()">
                                <span class="slider-round"></span>
                            </label>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <label class="section-label">Quick Add (oz)</label>
                    
                    <div class="quick-actions">
                        <button class="water-btn" onclick="addWater(5)">
                            <span class="material-symbols-outlined icon">water_drop</span>
                            5 oz
                        </button>
                        
                        <button class="water-btn" onclick="addWater(10)">
                            <span class="material-symbols-outlined icon">local_drink</span>
                            10 oz
                        </button>
                        
                        <button class="water-btn" onclick="addWater(20)">
                            <span class="material-symbols-outlined icon">water_bottle</span>
                            20 oz
                        </button>
                        
                        <button class="water-btn" onclick="addWater(40)">
                            <span class="material-symbols-outlined icon">bucket_check</span>
                            40 oz
                        </button>

                        <button class="water-btn" onclick="addWater(50)">
                            <span class="material-symbols-outlined icon">bucket_check</span>
                            50 oz
                        </button>
                    </div> 
                    <div class="custom-input-group">
                        <input type="number" id="customAmount" placeholder="Custom oz" class="pill-input">
                        <button class="add-btn" onclick="addCustomWater()">+</button>
                    </div>

                    <div class="undo-container">
                        <button class="undo-btn" onclick="undoLast()">
                            <span class="material-symbols-outlined">undo</span>
                            Undo last entry
                        </button>
                     </div>

                </div> 

                <div class="vertical-divider"></div>

                <div class="panel-section stats-zone">
                    <div class="section-header">
                        <h2>Flow & Frequency</h2>
                    </div>

                    <div class="stat-card">
                        <div class="stat-label">Current Streak</div>
                        <div class="stat-value" id="streakDisplay">0 Days</div>
                    </div>

                    <div class="chart-wrapper">
                        <div class="stat-summary">Weekly Flow</div>
                        <div class="chart-container" id="hydrationChart"></div>
                    </div>

                    <div class="divider"></div>

                    <div class="history-list">
    <h3>Today's Logs</h3>
    <div id="waterHistory"></div>
    
    <button class="view-all-btn" onclick="openHistoryModal()">View Full History</button>
</div>
                </div>

            </div>
        </div>

    </main>

<div id="historyModal" class="modal-overlay">
    <div class="modal-glass">
        <div class="modal-header">
            <h2>Hydration Archive</h2>
            <button class="close-modal" onclick="closeHistoryModal()">&times;</button>
        </div>
        <div class="modal-content" id="fullHistoryList">
            </div>
    </div>
</div>


</body>
</html>
