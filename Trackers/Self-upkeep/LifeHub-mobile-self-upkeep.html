<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vanity Lite</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<link rel="manifest" href="/manifest-mobile-self-upkeep.json">
<meta name="theme-color" content="#5A6B5D">
<link rel="apple-touch-icon" href="icon-192.png">

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js') // This looks at root, which is correct
                .then(reg => console.log('LifeHub Service Worker registered'))
                .catch(err => console.log('Service Worker failed:', err));
        });
    }
</script>

    <style>
        :root {
            --bg-body: #F9F7F2; /* Creamy Porcelain */
            --sage-dark: #5A6B5D;
            --sage-light: #8F9E91;
            --text-dark: #3e3831;
            --gold: #D4AF37;
            --card-bg: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Red Hat Display', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER --- */
        .app-header {
            padding: 20px 25px;
            padding-top: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-body);
            z-index: 10;
        }

        .app-title { font-size: 20px; font-weight: 800; color: var(--sage-dark); letter-spacing: -0.5px; text-transform: uppercase; }
        
        .date-picker {
            border: none; background: rgba(90, 107, 93, 0.1); 
            padding: 6px 12px; border-radius: 8px;
            font-family: inherit; font-size: 12px; color: var(--sage-dark);
            outline: none; font-weight: 600;
        }

        /* --- DAILY SCORE BANNER --- */
        .score-banner {
            margin: 0 25px 15px 25px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: 600; color: var(--sage-light); text-transform: uppercase; letter-spacing: 1px;
        }
        .points-val { color: var(--sage-dark); font-weight: 800; font-size: 14px; }

        /* --- ZONE REEL (Horizontal Scroll) --- */
        .zone-reel {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 5px 25px 20px 25px;
            scrollbar-width: none;
        }
        .zone-reel::-webkit-scrollbar { display: none; }

        .zone-card {
            min-width: 90px;
            height: 100px;
            background: #FFF;
            border-radius: 16px;
            padding: 10px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: 0.2s;
            border: 2px solid transparent;
            position: relative; /* For the meter positioning */
        }
        
        .zone-card.active { border-color: var(--sage-dark); background: #F4F8F5; transform: translateY(-2px); }
        
        .zone-icon { font-size: 24px; color: var(--sage-light); }
        .zone-name { font-size: 9px; font-weight: 700; text-transform: uppercase; text-align: center; line-height: 1.2; }

        /* Consistency Meter (Mini Bar at Bottom) */
        .consistency-track {
            width: 70%; height: 3px; background: #eee; border-radius: 2px; overflow: hidden; margin-top: 5px;
        }
        .consistency-fill {
            height: 100%; width: 0%; background: var(--sage-dark); transition: width 0.5s;
        }
        /* Hide label on mobile to save space */
        .consistency-label { display: none; }

        /* --- CONTENT AREA --- */
        .checklist-container {
            flex: 1;
            background: #FFF;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.03);
            padding: 25px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }

        .checklist-header {
            font-size: 10px; font-weight: 800; color: var(--sage-light); 
            text-transform: uppercase; letter-spacing: 1.5px; 
            margin-top: 15px; margin-bottom: 5px;
        }
        .checklist-header:first-child { margin-top: 0; }

        /* Checklist Item */
        .check-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px; border-radius: 12px;
            background: #F9F9F9; border: 1px solid #EEE;
            transition: 0.1s;
        }
        .check-item:active { transform: scale(0.98); }
        
        .check-item.completed { opacity: 0.5; background: #FFF; }
        .check-item.active-repeat { border-color: var(--sage-dark); background: #F4F8F5; }

        /* Custom Checkbox */
        .custom-checkbox {
            width: 22px; height: 22px; border: 2px solid #DDD; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; margin-right: 15px;
        }
        .check-item.completed .custom-checkbox { background: var(--sage-dark); border-color: var(--sage-dark); }
        .check-item.completed .custom-checkbox::after { content: '✔'; font-size: 12px; color: #fff; }

        /* Repeat Counter Circle */
        .repeat-counter {
            width: 26px; height: 26px; background: #EEE; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; color: #555; margin-right: 15px;
        }
        .check-item.active-repeat .repeat-counter { background: var(--sage-dark); color: #fff; }

        .check-text { font-size: 13px; font-weight: 500; color: var(--text-dark); flex: 1; }
        .check-reward { 
            font-size: 10px; font-weight: 700; color: var(--gold); 
            background: rgba(212, 175, 55, 0.1); padding: 4px 8px; border-radius: 6px; 
        }

        /* Repeat Undo Button (Small Minus) */
        .repeat-undo {
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #999; margin-left: 10px; padding: 5px;
        }

        /* Hidden Elements for JS Compatibility */
        .ghost { display: none; }

    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title">Vanity Lite</div>
        <input type="date" id="logDate" class="date-picker">
    </header>

    <div class="score-banner" id="dailySummary">
        <span>Today's Total</span>
        <span class="points-val">0 pts</span>
    </div>

    <div class="zone-reel">
        
        <div class="zone-card active" onclick="selectZone(this, 'Facial Care')" data-zone="Facial Care">
            <span class="material-symbols-rounded zone-icon">face</span>
            <span class="zone-name">Facial</span>
            <div class="consistency-track"><div class="consistency-fill"></div></div>
            <div class="consistency-label"><span class="consistency-text"></span></div>
        </div>

        <div class="zone-card" onclick="selectZone(this, 'Hair Care')" data-zone="Hair Care">
            <span class="material-symbols-rounded zone-icon">face_3</span>
            <span class="zone-name">Hair</span>
            <div class="consistency-track"><div class="consistency-fill"></div></div>
            <div class="consistency-label"><span class="consistency-text"></span></div>
        </div>

        <div class="zone-card" onclick="selectZone(this, 'Skin Care')" data-zone="Skin Care">
            <span class="material-symbols-rounded zone-icon">spa</span>
            <span class="zone-name">Skin</span>
            <div class="consistency-track"><div class="consistency-fill"></div></div>
            <div class="consistency-label"><span class="consistency-text"></span></div>
        </div>

        <div class="zone-card" onclick="selectZone(this, 'Dental Care')" data-zone="Dental Care">
            <span class="material-symbols-rounded zone-icon">dentistry</span>
            <span class="zone-name">Dental</span>
            <div class="consistency-track"><div class="consistency-fill"></div></div>
            <div class="consistency-label"><span class="consistency-text"></span></div>
        </div>

        <div class="zone-card" onclick="selectZone(this, 'Eye Care')" data-zone="Eye Care">
            <span class="material-symbols-rounded zone-icon">visibility</span>
            <span class="zone-name">Eyes</span>
            <div class="consistency-track"><div class="consistency-fill"></div></div>
            <div class="consistency-label"><span class="consistency-text"></span></div>
        </div>

        <div class="zone-card" onclick="selectZone(this, 'Miles Care')" data-zone="Miles Care">
            <span class="material-symbols-rounded zone-icon">pets</span>
            <span class="zone-name">Miles</span>
            <div class="consistency-track"><div class="consistency-fill"></div></div>
            <div class="consistency-label"><span class="consistency-text"></span></div>
        </div>

        <div class="zone-card" onclick="selectZone(this, 'Other Self Care')" data-zone="Other Self Care">
            <span class="material-symbols-rounded zone-icon">accessibility_new</span>
            <span class="zone-name">Other</span>
            <div class="consistency-track"><div class="consistency-fill"></div></div>
            <div class="consistency-label"><span class="consistency-text"></span></div>
        </div>

    </div>

    <div class="checklist-container" id="checklistContainer">
        </div>

    <div class="ghost">
        <h2 id="rightPanelTitle"></h2>
        <div id="cp-count"></div>
        <div id="checklistProgress"></div>
        <button id="historyBtn"></button>
        <button id="closeModal"></button>
    </div>

    <div class="modal-overlay" id="historyModal">
        <div class="modal-content">
            <div class="modal-body" id="historyList"></div>
        </div>
    </div>

    <!-- Must load first: tracker-self-upkeep.js pays through it. -->
    <script src="../../JS/lifehub-prestige-ledger.js"></script>
    <script src="js/tracker-self-upkeep.js"></script>

</body>
</html>
