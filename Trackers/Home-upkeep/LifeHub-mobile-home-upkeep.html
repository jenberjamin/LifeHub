<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estate Lite</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<link rel="manifest" href="/manifest-mobile-home-upkeep.json">
<meta name="theme-color" content="#5A6B5D">
<link rel="apple-touch-icon" href="icon-192.png">

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js') // This looks at root, which is correct
                .then(reg => console.log('LifeHub Service Worker registered'))
                .catch(err => console.log('Service Worker failed:', err));
        });
    }
</script>

    <style>
        :root {
            --bg-body: #F2F0E9; /* Warm Sage-Grey Paper */
            --sage-dark: #5A6B5D;
            --sage-light: #8F9E91;
            --sage-faint: #E0E5E1;
            --text-dark: #3e3831;
            --gold: #D4AF37;
            --card-bg: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Red Hat Display', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER --- */
        .app-header {
            padding: 20px 25px;
            padding-top: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-body);
            z-index: 10;
        }

        .app-title { font-size: 20px; font-weight: 800; color: var(--sage-dark); letter-spacing: -0.5px; text-transform: uppercase; }
        
        .date-picker {
            border: none; background: rgba(90, 107, 93, 0.1); 
            padding: 6px 12px; border-radius: 8px;
            font-family: inherit; font-size: 12px; color: var(--sage-dark);
            outline: none; font-weight: 600;
        }

        /* --- WALLET WIDGET (Sticky Top) --- */
        .wallet-widget {
            background: var(--gold);
            color: #fff;
            padding: 10px 20px;
            display: none; /* Hidden by default until money exists */
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

        .deposit-btn-small {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* --- NAVIGATION TABS --- */
        .nav-tabs {
            display: flex;
            padding: 0 20px;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid transparent;
            background: rgba(255,255,255,0.5);
            border-radius: 12px;
            text-align: center;
            font-size: 12px; font-weight: 600; color: var(--text-dark);
            text-transform: uppercase; letter-spacing: 1px;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--sage-dark);
            color: #fff;
            box-shadow: 0 4px 10px rgba(90, 107, 93, 0.2);
        }

        /* --- CONTENT AREA --- */
        .content-stage {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
            position: relative;
        }

        /* --- VIEW: TIMER --- */
        #view-timer { display: block; padding: 0 20px; }

        /* Zone Reel (Horizontal Scroll) */
        .zone-reel {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 5px 2px 15px 2px; /* Bottom padding for shadow */
            scrollbar-width: none; /* Hide scrollbar Firefox */
        }
        .zone-reel::-webkit-scrollbar { display: none; } /* Hide scrollbar Chrome */

        .zone-card {
            min-width: 110px;
            height: 110px;
            background: #FFF;
            border-radius: 16px;
            padding: 12px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .zone-card.active { border-color: var(--sage-dark); background: #F4F8F5; transform: translateY(-2px); }
        .zone-card.recording { border-color: #D4AF37; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }

        .zone-icon { font-size: 28px; color: var(--sage-light); }
        .zone-name { font-size: 9px; font-weight: 700; text-transform: uppercase; text-align: center; line-height: 1.2; }
        
        /* Mini Meter inside card */
        .meter-bg { width: 100%; height: 4px; background: #EEE; border-radius: 4px; overflow: hidden; }
        .meter-fill { height: 100%; background: var(--sage-light); width: 0%; transition: width 0.5s; }

        /* Timer Display */
        .timer-stage {
            margin-top: 30px;
            text-align: center;
            background: #FFF;
            border-radius: 25px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }
        
        .zone-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--sage-light); margin-bottom: 10px; }
        .timer-digits { font-size: 48px; font-weight: 300; color: var(--text-dark); font-variant-numeric: tabular-nums; letter-spacing: -1px; }
        
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 25px; }
        .ctrl-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; transition: 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .btn-play { background: var(--sage-dark); color: #fff; }
        .btn-play:active { transform: scale(0.95); }
        .btn-stop { background: #fff; color: var(--text-dark); border: 2px solid #EEE; }

        /* Log List */
        .log-container { margin-top: 30px; }
        .log-item { 
            display: flex; justify-content: space-between; padding: 12px 0; 
            border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 12px; 
        }
        .log-right { font-weight: 700; color: var(--sage-dark); }

        /* --- VIEW: CHECKLIST --- */
        #view-checklist { display: none; padding: 0 20px; }

        .mode-toggle-row {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .mode-btn {
            flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ddd;
            background: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase;
            color: #999; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .mode-btn.active {
            border-color: var(--sage-dark); color: var(--sage-dark); background: var(--sage-faint);
        }

        .check-item {
            background: #FFF; padding: 15px; border-radius: 12px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: 0.2s;
        }
        .check-item.completed { opacity: 0.5; background: #F4F4F4; }
        
        .check-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .custom-checkbox {
            width: 20px; height: 20px; border: 2px solid #CCC; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .check-item.completed .custom-checkbox { background: var(--sage-dark); border-color: var(--sage-dark); }
        .check-item.completed .custom-checkbox::after { content: '✔'; font-size: 10px; color: #fff; }
        
        .check-text { font-size: 13px; font-weight: 500; }
        .check-reward { 
            font-size: 10px; font-weight: 700; color: var(--gold); 
            background: rgba(212, 175, 55, 0.1); padding: 4px 8px; border-radius: 6px; 
        }

    </style>
</head>
<body>

    <div id="walletPanel" class="wallet-widget">
        <span>EARNINGS: <span id="holdingDisplay">0.00</span></span>
        <button class="deposit-btn-small" onclick="depositHolding()">Deposit</button>
    </div>

    <header class="app-header">
        <div class="app-title">Estate Lite</div>
        <input type="date" id="logDate" class="date-picker">
    </header>

    <div class="nav-tabs">
        <div class="tab-btn active" onclick="switchView('timer'); this.classList.add('active'); this.nextElementSibling.classList.remove('active');">Focus Timer</div>
        <div class="tab-btn" onclick="switchView('checklist'); this.classList.add('active'); this.previousElementSibling.classList.remove('active');">Task List</div>
    </div>

    <div class="content-stage">
        
        <div id="view-timer">
            
            <div class="zone-reel">
    
    <div class="zone-card active" onclick="selectZone(this, 'My Bedroom')">
        <span class="material-symbols-rounded zone-icon">bed</span>
        <span class="zone-name">My Bedroom</span>
        <div class="meter-bg"><div class="meter-fill"></div></div>
        <div class="stat-row" style="display:none;"></div> 
    </div>

    <div class="zone-card" onclick="selectZone(this, 'Bathroom')">
        <span class="material-symbols-rounded zone-icon">bathtub</span>
        <span class="zone-name">Bathroom</span>
        <div class="meter-bg"><div class="meter-fill"></div></div>
        <div class="stat-row" style="display:none;"></div>
    </div>

    <div class="zone-card" onclick="selectZone(this, 'Living Room')">
        <span class="material-symbols-rounded zone-icon">chair</span>
        <span class="zone-name">Living Room</span>
        <div class="meter-bg"><div class="meter-fill"></div></div>
        <div class="stat-row" style="display:none;"></div>
    </div>

    <div class="zone-card" onclick="selectZone(this, 'Kitchen')">
        <span class="material-symbols-rounded zone-icon">kitchen</span>
        <span class="zone-name">Kitchen</span>
        <div class="meter-bg"><div class="meter-fill"></div></div>
        <div class="stat-row" style="display:none;"></div>
    </div>

    <div class="zone-card" onclick="selectZone(this, 'Dining Room')">
        <span class="material-symbols-rounded zone-icon">restaurant</span>
        <span class="zone-name">Dining Room</span>
        <div class="meter-bg"><div class="meter-fill"></div></div>
        <div class="stat-row" style="display:none;"></div>
    </div>

    <div class="zone-card" onclick="selectZone(this, 'Balcony')">
        <span class="material-symbols-rounded zone-icon">deck</span>
        <span class="zone-name">Balcony</span>
        <div class="meter-bg"><div class="meter-fill"></div></div>
        <div class="stat-row" style="display:none;"></div>
    </div>

    <div class="zone-card" onclick="selectZone(this, 'Mama\'s Bedroom')">
        <span class="material-symbols-rounded zone-icon">bedroom_parent</span>
        <span class="zone-name">Mama's Bedroom</span>
        <div class="meter-bg"><div class="meter-fill"></div></div>
        <div class="stat-row" style="display:none;"></div>
    </div>

    <div class="zone-card" onclick="selectZone(this, 'Denden\'s Bedroom')">
        <span class="material-symbols-rounded zone-icon">bedroom_child</span>
        <span class="zone-name">Denden's Bedroom</span>
        <div class="meter-bg"><div class="meter-fill"></div></div>
        <div class="stat-row" style="display:none;"></div>
    </div>

    <div class="zone-card" onclick="selectZone(this, 'Store')">
        <span class="material-symbols-rounded zone-icon">storefront</span>
        <span class="zone-name">Store</span>
        <div class="meter-bg"><div class="meter-fill"></div></div>
        <div class="stat-row" style="display:none;"></div>
    </div>

</div>

            <div class="timer-stage">
                <div class="zone-label" id="activeZoneLabel">Ready: My Bedroom</div>
                <div class="timer-digits">00:00:00</div>
                
                <div class="controls timer-controls">
                    <button class="ctrl-btn btn-play"><span class="material-symbols-rounded">play_arrow</span></button>
                    <button class="ctrl-btn btn-stop"><span class="material-symbols-rounded">stop</span></button>
                </div>
            </div>

            <div class="log-container"></div>
        </div>

        <div id="view-checklist">
            
            <h2 id="rightPanelTitle" style="display:none;"></h2> <div class="mode-toggle-row">
                <button class="mode-btn active" onclick="selectTaskMode(this, 'Sanitation')">
                    <span class="material-symbols-rounded">sanitizer</span> Sanitation
                </button>
                <button class="mode-btn" onclick="selectTaskMode(this, 'Upkeep')">
                    <span class="material-symbols-rounded">home_work</span> Upkeep
                </button>
            </div>

            <div class="checklist-stats" style="margin-bottom:15px; font-size:11px; opacity:0.6;">
                Completed: <span id="cp-count">0/0</span>
                <div style="height:3px; background:#eee; margin-top:5px; border-radius:3px;">
                    <div id="checklistProgress" style="height:100%; width:0%; background:var(--sage-dark); border-radius:3px;"></div>
                </div>
            </div>

            <div id="checklistContainer">
                </div>
        </div>

    </div>

    <!-- Must load first: tracker-home-upkeep.js banks through it. -->
<script src="../../JS/lifehub-prestige-ledger.js"></script>
<script src="js/tracker-home-upkeep.js"></script>

</body>
</html>
